name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    container:
      image: node:20-alpine
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: Qw3rty!235
          POSTGRES_DB: queuing_system
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install system dependencies
        run: |
          apk add --no-cache \
            ca-certificates \
            curl \
            git \
            erlang \
            erlang-dev \
            rebar3 \
            build-base \
            postgresql-client

      - name: Install Gleam
        run: |
          GLEAM_VERSION="1.18.0"
          curl -fsSL "https://github.com/gleam-lang/gleam/releases/download/v${GLEAM_VERSION}/gleam-v${GLEAM_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin/ gleam
          gleam --version

      - name: Cache Gleam dependencies
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cache/gleam
            build/
          key: ${{ runner.os }}-gleam-${{ hashFiles('gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-

      - name: Get PostgreSQL connection details
        run: |
          echo "DATABASE_URL=postgres://root:***@localhost:5432/queuing_system" >> $GITHUB_ENV

      - name: Build project
        run: |
          gleam deps download
          gleam build

      - name: Run tests
        run: |
          gleam test

      - name: Check formatting
        run: |
          gleam format --check .

      # TODO: Remove commented-out notification workflow at the end
